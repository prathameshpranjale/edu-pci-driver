name: ci

on:
  push:
  pull_request:

env:
  KVER: "6.6.87"
  WORK: /home/runner/kwork

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qemu-system-x86 busybox-static \
            flex bison bc cpio libssl-dev libelf-dev

      - name: Enable KVM if the runner has it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU will use software emulation"

      # The kernel (KASAN + lockdep) is slow to build, so cache the whole tree.
      # The key changes when the build script (and therefore the config) changes.
      - name: Cache kernel build
        id: kcache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK }}
          key: kernel-${{ env.KVER }}-${{ hashFiles('scripts/build_kernel.sh') }}

      - name: Build kernel
        if: steps.kcache.outputs.cache-hit != 'true'
        run: NO_DEBUG_INFO=1 scripts/build_kernel.sh

      - name: Build driver, boot QEMU, run tests
        run: scripts/test.sh
